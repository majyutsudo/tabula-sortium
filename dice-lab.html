<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DICE LAB — Physics Experiment / TABULA SORTIUM</title>
<style>
:root{color-scheme:dark;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;background:#101815;color:#eadfc8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 5%,#24372e,#101815 70%);display:flex;justify-content:center;padding:clamp(9px,3vw,28px)}
main{width:min(840px,100%);display:grid;align-content:start;gap:13px}
header{text-align:center}.eyebrow{font-size:10px;letter-spacing:.32em;color:#bca577}h1{font-size:clamp(25px,4vw,35px);font-weight:normal;letter-spacing:.20em;margin:7px 0 4px}.subtitle{font-size:12px;color:#b7ad93;letter-spacing:.12em}
.frame{position:relative;padding:9px;border:1px solid #786443;background:#292820;box-shadow:0 14px 45px #0009,inset 0 0 0 2px #39342a;border-radius:16px}
#felt{position:relative;height:clamp(340px,58dvh,535px);touch-action:none;overflow:hidden;border:1px solid #3d5745;border-radius:10px;background:radial-gradient(ellipse at 50% 44%,#355747 0%,#243e33 64%,#192e26 100%);box-shadow:inset 0 0 90px #08170ed9,inset 0 0 0 1px #58715a2f;cursor:crosshair}
#felt:focus-visible,button:focus-visible{outline:2px solid #e0be78;outline-offset:3px}
#felt canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
.corner{position:absolute;z-index:2;font-size:10px;letter-spacing:.19em;color:#bad2b88e;pointer-events:none}.tl{left:14px;top:13px}.br{bottom:12px;right:12px}
#throwGuide{display:none;position:absolute;z-index:5;inset:0;width:100%;height:100%;pointer-events:none}
#throwGuide line{stroke:#f1d59f;stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
#throwGuide circle{fill:#e7ce9b44;stroke:#ead09a;stroke-width:2}
#throwGuide polygon{fill:#ead09a}
.status{text-align:center;color:#cabb95;font-size:11px;letter-spacing:.17em;min-height:16px}
.control-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.control-row span{font-size:12px;color:#c2b495;margin-right:3px}
button{font:inherit;cursor:pointer}
.mode{border:1px solid #5c6d58;color:#d1c3a7;background:#21342d;border-radius:5px;padding:9px 15px;min-height:38px}
.mode[aria-pressed=true]{background:#705d3a;color:#fff0c9;border-color:#d6ba81}
#roll{margin:0 auto;width:min(320px,100%);border:1px solid #dbc08a;color:#2b271b;background:linear-gradient(#e3cb99,#b99b62);min-height:54px;padding:12px 20px;border-radius:5px;font-size:17px;letter-spacing:.12em;box-shadow:0 3px 0 #6a5739,0 6px 16px #0006}
#roll:hover{filter:brightness(1.08)}#roll:disabled{opacity:.60;cursor:wait}
.results{display:flex;justify-content:center;align-items:baseline;gap:20px;flex-wrap:wrap;min-height:32px;font-variant-numeric:tabular-nums}
#values{font-size:16px;color:#d8c7a1}#total{font-size:24px;color:#edd8aa}
.note{font-size:11px;line-height:1.8;text-align:center;color:#a89e88;margin:0 0 8px}
#failure{color:#f2c7aa;text-align:center;font-size:12px;line-height:1.6}
@media(max-width:480px){body{padding:8px}main{gap:10px}.frame{padding:6px}#felt{height:52dvh;min-height:340px}.mode{padding:8px 11px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">TABULA SORTIUM / EXPERIMENT 10</div><h1>DICE LAB</h1><div class="subtitle">PHYSICS OF FORTUNE</div></header>
<div class="frame">
 <div id="felt" tabindex="0" role="button" aria-label="ドラッグしてダイスを投げる"><div class="corner tl">TABULA · DICE</div><div class="corner br">RIGID BODY EXPERIMENT</div>
 <svg id="throwGuide" aria-hidden="true"><circle id="startPoint" r="11"/><line id="throwLine"/><polygon id="throwArrow" points="0,0 -14,-7 -14,7"/></svg>
 </div>
</div>
<div class="status" id="status" aria-live="polite">物理エンジンを読み込み中…</div>
<div class="control-row" role="group" aria-label="投げ方"><span>投げ方</span><button type="button" class="mode" data-strength="gentle" aria-pressed="false">そっと</button><button type="button" class="mode" data-strength="normal" aria-pressed="true">普通</button><button type="button" class="mode" data-strength="strong" aria-pressed="false">勢いよく</button></div>
<button type="button" id="roll" disabled>◆　ダイスを振る　◆</button>
<div class="results" aria-live="polite"><span id="values">—</span><span id="total">合計 —</span></div>
<div id="failure" role="alert" hidden></div>
<p class="note">D6 × 3個。本物の剛体シミュレーションを使った比較実験です。<br>卓をドラッグして離すと、方向と勢いを指定できます。<a href="dice-lab-legacy.html" style="color:#c6af7b">旧実験版09</a></p>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js';
import RAPIER from 'https://esm.sh/@dimforge/rapier3d-compat@0.17.3';

const felt=document.getElementById('felt');
const button=document.getElementById('roll');
const status=document.getElementById('status');
const values=document.getElementById('values');
const total=document.getElementById('total');
const failure=document.getElementById('failure');
const modes={gentle:.57,normal:1,strong:1.65};
let strength='normal',world,scene,camera,renderer,ground,objects=[],rolling=false,frame=0;
let width=10,depth=6.6,lastTime=0,accumulator=0,rollTime=0,stableTime=0,ready=false;
const DICE_SIZE=.76,HALF=DICE_SIZE/2,FIXED_STEP=1/60;
const up=new THREE.Vector3(0,1,0);
const faceNormals=[
 new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),
 new THREE.Vector3(0,1,0),new THREE.Vector3(0,-1,0),
 new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)
];
const faceValues=[3,4,1,6,2,5]; // Three.js box material ordering: +X -X +Y -Y +Z -Z
const pipGrid={
 1:[[0,0]],2:[[-1,-1],[1,1]],3:[[-1,-1],[0,0],[1,1]],
 4:[[-1,-1],[-1,1],[1,-1],[1,1]],
 5:[[-1,-1],[-1,1],[0,0],[1,-1],[1,1]],
 6:[[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]
};
const diceColors=['#efe3c9','#c65343','#557da3'];
function faceTexture(value,color){
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
 const c=canvas.getContext('2d');c.fillStyle=color;c.fillRect(0,0,256,256);
 const shade=c.createLinearGradient(0,0,256,256);shade.addColorStop(0,'#ffffff50');shade.addColorStop(.65,'#ffffff00');shade.addColorStop(1,'#0000003c');c.fillStyle=shade;c.fillRect(0,0,256,256);
 c.strokeStyle='#171a1990';c.lineWidth=6;c.strokeRect(7,7,242,242);
 let col=0;const hex=color.slice(1),rgb=parseInt(hex,16),r=rgb>>16&255,g=rgb>>8&255,b=rgb&255;
 col=r*.299+g*.587+b*.114;
 c.fillStyle=col<140?'#f8eed6':'#25221f';
 for(const [x,y] of pipGrid[value]){
  c.beginPath();c.arc(128+x*68,128+y*68,16,0,Math.PI*2);c.fill();
 }
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=4;
 return texture;
}
function updateDimensions(){
 const w=felt.clientWidth||800,h=felt.clientHeight||520;
 width=10;depth=10*h/w;
 // Avoid a tall, narrow table causing dice to be too small on mobile.
 if(depth>14){width=8;depth=8*h/w}
 renderer.setSize(w,h,false);
 renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
 camera.left=-width*.53;camera.right=width*.53;
 camera.top=depth*.53;camera.bottom=-depth*.53;
 camera.position.set(0,13,3.3);
 camera.lookAt(0,0,0);
 camera.updateProjectionMatrix();
 ground.scale.set(width,1,depth);
 // Walls are rebuilt when the aspect ratio changes, without disturbing dice.
 if(world)buildWalls();
}
let wallColliders=[];
function buildWalls(){
 for(const col of wallColliders){world.removeCollider(col,true)}
 wallColliders=[];
 const wallHeight=2.0;
 const segments=[
 {x:0,z:depth/2+.19,hx:width/2+.3,hz:.22},
 {x:0,z:-depth/2-.19,hx:width/2+.3,hz:.22},
 {x:width/2+.19,z:0,hx:.22,hz:depth/2+.3},
 {x:-width/2-.19,z:0,hx:.22,hz:depth/2+.3}
 ];
 for(const o of segments){
  wallColliders.push(world.createCollider(
   RAPIER.ColliderDesc.cuboid(o.hx,wallHeight,o.hz)
    .setTranslation(o.x,wallHeight-.1,o.z).setRestitution(.28).setFriction(.8)
  ));
 }
}
function createDice(){
 const geo=new THREE.BoxGeometry(DICE_SIZE,DICE_SIZE,DICE_SIZE);
 for(let i=0;i<3;i++){
  const materials=faceValues.map(n=>new THREE.MeshStandardMaterial({map:faceTexture(n,diceColors[i]),roughness:.47,metalness:.025}));
  const mesh=new THREE.Mesh(geo,materials);
  mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  const body=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
   .setTranslation((i-1)*1.2,HALF+.03,0)
   .setLinearDamping(.13).setAngularDamping(.23).setCanSleep(true).setCcdEnabled(true));
  world.createCollider(RAPIER.ColliderDesc.cuboid(HALF,HALF,HALF).setRestitution(.38).setFriction(.76).setDensity(1),body);
  objects.push({mesh,body});
 }
}
function syncMeshes(){
 for(const {mesh,body} of objects){
  const p=body.translation(),q=body.rotation();
  mesh.position.set(p.x,p.y,p.z);mesh.quaternion.set(q.x,q.y,q.z,q.w);
 }
}
function topFace(object){
 const q=object.mesh.quaternion;let best=-1,index=0;
 for(let i=0;i<6;i++){
  const score=faceNormals[i].clone().applyQuaternion(q).dot(up);
  if(score>best){best=score;index=i}
 }
 return faceValues[index];
}
function random(min,max){return min+Math.random()*(max-min)}
function releaseDice(options={}){
 if(!ready||rolling)return;
 rolling=true;rollTime=0;stableTime=0;accumulator=0;
 button.disabled=true;values.textContent='—';total.textContent='合計 —';
 status.textContent='ROLLING…';
 const dir=options.direction||{x:0,y:-1};
 const length=Math.hypot(dir.x,dir.y)||1;
 const dx=dir.x/length,dz=dir.y/length;
 const power=options.power??modes[strength];
 // The launch is beyond the near/opposite table edge, then enters toward its centre.
 // In 3D, the edge is a low wall; spawn just inside the tabletop and above it,
 // with horizontal momentum aimed in the dragged direction.
 const tx=-dz,tz=dx;
 const across=dx!==0||dz!==0;
 let edgeDistance=Infinity;
 if(dx>1e-4)edgeDistance=Math.min(edgeDistance,(width*.43)/dx);
 if(dx< -1e-4)edgeDistance=Math.min(edgeDistance,(width*.43)/-dx);
 if(dz>1e-4)edgeDistance=Math.min(edgeDistance,(depth*.43)/dz);
 if(dz< -1e-4)edgeDistance=Math.min(edgeDistance,(depth*.43)/-dz);
 edgeDistance=Math.min(edgeDistance,Math.max(width,depth));
 const originX=-dx*edgeDistance,originZ=-dz*edgeDistance;
 objects.forEach(({body},i)=>{
  const offset=(i-1)*Math.min(1.14,width*.19);
  body.wakeUp();
  body.setTranslation({x:originX+tx*offset,y:random(1.9,2.8)+power*.22,z:originZ+tz*offset},true);
  const orientation=new THREE.Quaternion().setFromEuler(new THREE.Euler(random(-3,3),random(-3,3),random(-3,3)));
  body.setRotation({x:orientation.x,y:orientation.y,z:orientation.z,w:orientation.w},true);
  body.setLinvel({x:dx*random(3.8,5.2)*power+random(-.6,.6),
    y:random(-1.7,-.5)*Math.max(.65,power),z:dz*random(3.8,5.2)*power+random(-.6,.6)},true);
  body.setAngvel({x:random(-12,12)*power,y:random(-11,11)*power,z:random(-12,12)*power},true);
 });
}
function render(time){
 frame=requestAnimationFrame(render);
 const dt=Math.min(.05,lastTime?(time-lastTime)/1000:0);lastTime=time;
 if(ready){
  accumulator=Math.min(.12,accumulator+dt);
  while(accumulator>=FIXED_STEP){world.step();accumulator-=FIXED_STEP}
  syncMeshes();
  if(rolling){
   rollTime+=dt;
   const stopped=objects.every(({body})=>body.isSleeping()||(
    body.linvel().x**2+body.linvel().y**2+body.linvel().z**2<.008
    &&body.angvel().x**2+body.angvel().y**2+body.angvel().z**2<.02
   ));
   stableTime=stopped?stableTime+dt:0;
   if(stableTime>.50||rollTime>12){
    rolling=false;button.disabled=false;
    const results=objects.map(topFace);
    values.textContent=results.join(' · ');
    total.textContent='合計 '+results.reduce((n,v)=>n+v,0);
    status.textContent='THE DICE HAVE FALLEN';
   }
  }
 }
 renderer.render(scene,camera);
}
async function init(){
 try{
  await RAPIER.init();
  world=new RAPIER.World({x:0,y:-15,z:0});
  world.timestep=FIXED_STEP;
  world.createCollider(RAPIER.ColliderDesc.cuboid(100,.2,100).setTranslation(0,-.2,0).setFriction(.86).setRestitution(.28));
  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,100);
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
  renderer.setClearColor(0,0);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  felt.prepend(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xe1efe8,0x1a3427,2.3));
  const key=new THREE.DirectionalLight(0xffe9c5,3.0);key.position.set(-4,9,6);
  key.castShadow=true;key.shadow.mapSize.set(1024,1024);
  key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;
  key.shadow.normalBias=.015;scene.add(key);
  ground=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.32}));
  ground.rotation.x=-Math.PI/2;ground.position.y=.007;ground.receiveShadow=true;scene.add(ground);
  updateDimensions();
  createDice();syncMeshes();
  ready=true;button.disabled=false;status.textContent='READY TO ROLL';
  frame=requestAnimationFrame(render);
  new ResizeObserver(updateDimensions).observe(felt);
 }catch(error){
  console.error(error);
  status.textContent='読み込みに失敗しました';
  failure.hidden=false;
  failure.textContent='3D描画または物理エンジンを読み込めませんでした。通信環境・WebGL対応を確認してください。'+(error?.message||'');
 }
}
document.querySelectorAll('.mode').forEach(mode=>mode.addEventListener('click',()=>{
 strength=mode.dataset.strength;
 document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b===mode)));
}));
button.addEventListener('click',()=>releaseDice());
const guide=document.getElementById('throwGuide'),startPoint=document.getElementById('startPoint'),line=document.getElementById('throwLine'),arrow=document.getElementById('throwArrow');
let gesture=null,suppressClick=false;
function local(event){const r=felt.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top}}
function drawGuide(x,y,dx,dy){
 const size=Math.hypot(dx,dy),scale=Math.min(1,170/(size||1));
 const X=x+dx*scale,Y=y+dy*scale;
 guide.style.display='block';guide.setAttribute('viewBox','0 0 '+felt.clientWidth+' '+felt.clientHeight);
 startPoint.setAttribute('cx',x);startPoint.setAttribute('cy',y);
 for(const [attribute,value] of [['x1',x],['y1',y],['x2',X],['y2',Y]])line.setAttribute(attribute,value);
 arrow.setAttribute('transform','translate('+X+' '+Y+') rotate('+(Math.atan2(dy,dx)*180/Math.PI)+')');
}
felt.addEventListener('pointerdown',event=>{
 if(!ready||rolling||!event.isPrimary||event.button!==0)return;
 const p=local(event);gesture={id:event.pointerId,x:event.clientX,y:event.clientY,localX:p.x,localY:p.y,time:performance.now()};
 felt.setPointerCapture(event.pointerId);drawGuide(p.x,p.y,0,0);
});
felt.addEventListener('pointermove',event=>{
 if(!gesture||gesture.id!==event.pointerId)return;
 drawGuide(gesture.localX,gesture.localY,event.clientX-gesture.x,event.clientY-gesture.y);
});
felt.addEventListener('pointerup',event=>{
 if(!gesture||gesture.id!==event.pointerId)return;
 const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
 const distance=Math.hypot(dx,dy),elapsed=Math.max(1,performance.now()-gesture.time);
 gesture=null;guide.style.display='none';
 if(distance<25)return;
 const power=Math.max(.40,Math.min(2.2,.32+distance/165+(distance/elapsed)*.20));
 suppressClick=true;releaseDice({direction:{x:dx/distance,y:dy/distance},power});
});
felt.addEventListener('pointercancel',()=>{gesture=null;guide.style.display='none'});
felt.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}releaseDice()});
felt.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();releaseDice()}});
init();
</script>
</body>
</html>
