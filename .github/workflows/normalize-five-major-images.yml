name: Normalize five major-arcana image assets
on:
  push:
    branches: [cleanup/schema-v1]
    paths:
      - .github/workflows/normalize-five-major-images.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Preserve originals and produce compact base variants
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          folder=Path("images/decks/tabula-tarot")
          target_size=Image.open(folder/"base/major_14.webp").size
          ids=["major_15","major_16","major_18","major_19","major_21"]
          for cid in ids:
              original=folder/"base"/f"{cid}.webp"
              restored=folder/"restored"/f"{cid}.webp"
              shutil.copyfile(original,restored)
              with Image.open(restored) as im:
                  if im.size != target_size:
                      im=im.resize(target_size,Image.Resampling.LANCZOS)
                  im.save(original,"WEBP",quality=80,method=6)
              print(cid,"base size",original.stat().st_size,"restored size",restored.stat().st_size)
          js=Path("js/tabula.js")
          source=js.read_text(encoding="utf-8")
          marker="const RESTORED_CARD_IMAGES={"
          assert source.count(marker)==1,"Could not locate image mapping"
          entries="".join(f'"{cid}":"images/decks/tabula-tarot/restored/{cid}.webp",' for cid in ids)
          source=source.replace(marker,marker+entries,1)
          js.write_text(source,encoding="utf-8")
          PY
      - name: Verify all five variants and references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("images/decks/tabula-tarot")
          code=Path("js/tabula.js").read_text(encoding="utf-8")
          for n in (15,16,18,19,21):
              cid=f"major_{n:02d}"
              for tier in ("base","restored"):
                  path=root/tier/(cid+".webp")
                  assert path.is_file()
                  with Image.open(path) as im: im.verify()
              assert f'images/decks/tabula-tarot/restored/{cid}.webp' in code
          PY
      - name: Commit normalized assets to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/decks/tabula-tarot/base images/decks/tabula-tarot/restored js/tabula.js
          git commit -m "Normalize five major arcana assets into base and restored tiers"
          git push
