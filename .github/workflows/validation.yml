name: TABULA validation

# Opt-in only: adding the run-validation label to PR #1 runs checks once.
# Commits do not trigger duplicate workflows or notification floods.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static schema checks
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Identity and backup browser smoke checks
        run: npx playwright test tests/browser/storage.spec.mjs tests/browser/acceptance.spec.mjs --grep 'physical IDs|duplicate IDs|full JSON backup|new custom spread is created|full artwork subtitles' --retries=0
      - name: Browser regression tests
        run: npm run test:browser
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
