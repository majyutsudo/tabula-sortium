<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABULA PLAYING CARDS — 編集</title>
<style>
:root{font-family:Georgia,"Yu Mincho",serif;color:#ece0c7;background:#17211c}*{box-sizing:border-box}body{margin:0}header{padding:22px max(16px,calc((100vw - 1200px)/2));background:#233027;border-bottom:1px solid #806c4d}h1{font-size:25px;margin:6px 0}h2{font-size:17px}p{font-size:13px;line-height:1.6;color:#c6bea9}a{color:#ebd4a5}button{cursor:pointer;background:#38463b;color:#f4e2bd;border:1px solid #957e59;border-radius:5px;padding:8px 10px}button.primary{background:#886b41}button:disabled{opacity:.5}input,select{background:#202d25;color:#f3e9d9;border:1px solid #89775b;border-radius:5px;padding:8px;width:100%;min-width:0}label{display:grid;gap:6px;font-size:13px}main{max-width:1240px;padding:18px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.panel{padding:15px;background:#253129;border:1px solid #695c45;border-radius:8px;margin-bottom:14px}.stack{display:grid;gap:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}.tabs button.selected{background:#92744c}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.card{background:#2e3b31;border:1px solid #72644f;border-radius:5px;padding:7px;display:grid;gap:6px;text-align:center}.card svg{width:100%;aspect-ratio:2/3;display:block}.caption{font:12px/1.4 sans-serif;min-height:32px;overflow-wrap:anywhere}.card button{font:12px sans-serif}#status{color:#eacb91;min-height:26px;font:12px/1.5 sans-serif}dialog{color:#f1e3cb;background:#243228;border:1px solid #a58a60;border-radius:8px;width:min(440px,92vw)}dialog::backdrop{background:#000b}dialog form{display:grid;gap:13px}small{letter-spacing:.18em;color:#c9ad7d}@media(max-width:750px){main{display:block}.cards{grid-template-columns:repeat(auto-fill,minmax(95px,1fr))}}
</style></head><body><header><small>TABULA / PLAYING CARD EDITOR</small><h1>PLAYING CARDS — デッキ編集</h1><p>52枚とジョーカー2枚を保ち、カード名称を編集します。標準デッキは変更せず、派生デッキを共通ライブラリへ保存します。</p><a href="index.html">TABULAへ戻る</a>　<a href="deck-designer.html">デッキ設計室</a></header>
<main><aside><section class="panel stack"><h2>デッキ管理</h2><label>読み込むデッキ<select id="source"></select></label><div class="actions"><button id="new">標準から作成</button><button id="copy">複製</button></div><label>デッキ名<input id="deckName" maxlength="80"></label><label>カード名の言語<select id="language"></select></label><div class="actions"><button class="primary" id="save">デッキを保存</button><button id="delete">削除</button></div><div id="status" role="status"></div></section><section class="panel"><h2>編集範囲</h2><p>カードを選んで名称と表記を変更できます。標準の絵柄をそのまま利用し、スート・ランク・カードIDは固定します。</p><p>自由なカード体系を設計する場合は「デッキ設計室」を利用してください。</p></section></aside><section class="panel"><h2>カード一覧 <span id="count"></span></h2><div id="tabs" class="tabs"></div><div id="cards" class="cards"></div></section></main>
<dialog id="dialog"><form method="dialog"><h2 id="editTitle"></h2><label>名称<input id="cardName" maxlength="120" required></label><label>番号・文字の表示<input id="cardNumber" maxlength="12"></label><p>絵柄は標準PLAYING CARDSのものを維持します。</p><div class="actions"><button value="cancel">キャンセル</button><button value="apply" class="primary">変更</button></div></form></dialog>
<script src="js/deck-blueprint.js?v=0380"></script><script>
(()=>{'use strict';
const API=TabulaDeckBlueprint,$=id=>document.getElementById(id),base=API.builtInPlaying,sets=API.nameSets(base);
const copy=o=>JSON.parse(JSON.stringify(o)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>API.load().filter(d=>d.playingFamily===true);
function fresh(source=base){const d=copy(source);d.id='blueprint_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);d.playingFamily=true;d.name=source===base?'新しいPLAYING CARD':source.name+'（複製）';d.nameSets=copy(sets);return d}
let draft=fresh(),tab='all',editing=null,dirty=false;
const msg=s=>$('status').textContent=s;
function name(c,lang=$('language').value){return c.names?.[lang]||(lang==='primary'?c.name:API.playingName(c,lang))}
function picker(){$('source').replaceChildren(new Option('TABULA PLAYING CARDS（標準）',base.id),...saved().map(d=>new Option(d.name,d.id)));$('source').value=saved().some(d=>d.id===draft.id)?draft.id:base.id;$('delete').disabled=!saved().some(d=>d.id===draft.id)}
function render(){picker();$('deckName').value=draft.name;const active=$('language').dataset.active||'primary';$('language').replaceChildren(...sets.map(s=>new Option(s.label,s.id)));$('language').value=active;
 $('tabs').replaceChildren(...[['all','全54枚'],...base.suits.map(s=>[s.id,s.symbol+' '+s.name]),['joker','ジョーカー']].map(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.group=id;b.onclick=()=>{tab=id;cards()};return b}));cards()}
function cards(){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.group===tab));
 const list=API.generate(draft).filter(c=>tab==='all'||tab==='joker'&&c.kind==='joker'||c.suitId===tab);
 $('count').textContent='· '+list.length+'枚';$('cards').replaceChildren(...list.map(c=>{const s=draft.suits.find(s=>s.id===c.suitId),node=document.createElement('div');node.className='card';const art=document.createElement('div');art.innerHTML=API.playingFaceMarkup(c,s?.symbol||'✦',s?.color||'black',c.number);if(art.firstElementChild)node.append(art.firstElementChild);
 const label=document.createElement('div');label.className='caption';label.textContent=name(c);const btn=document.createElement('button');btn.textContent='編集';btn.onclick=()=>edit(c.id);node.append(label,btn);return node}));}
function edit(id){const c=API.generate(draft).find(x=>x.id===id);if(!c)return;editing=id;$('editTitle').textContent=name(c)+' — 編集';$('cardName').value=name(c);$('cardNumber').value=c.number||'';$('dialog').showModal()}
$('dialog').addEventListener('close',()=>{if($('dialog').returnValue!=='apply'||!editing)return;const c=API.generate(draft).find(x=>x.id===editing),nameValue=$('cardName').value.trim();if(!c||!nameValue)return;
 const i=draft.cards.findIndex(x=>x.id===editing),item=i<0?copy(c):copy(draft.cards[i]),lang=$('language').value;item.names??={};if(lang==='primary')item.name=nameValue;else item.names[lang]=nameValue;item.number=$('cardNumber').value.trim();if(i<0)draft.cards.push(item);else draft.cards[i]=item;dirty=true;cards();msg('未保存の変更があります。')});
$('language').onchange=e=>{e.target.dataset.active=e.target.value;cards()};
$('deckName').oninput=e=>{draft.name=e.target.value;dirty=true};
$('source').onchange=e=>{if(dirty&&!confirm('未保存の変更を破棄しますか？')){picker();return}draft=e.target.value===base.id?fresh():copy(saved().find(d=>d.id===e.target.value)||fresh());dirty=false;render();msg('デッキを読み込みました。')};
$('new').onclick=()=>{if(dirty&&!confirm('未保存の変更を破棄しますか？'))return;draft=fresh();dirty=false;render();msg('新しいデッキを編集できます。')};
$('copy').onclick=()=>{draft=fresh(draft);dirty=true;render();msg('内容を複製しました。')};
$('save').onclick=()=>{draft.name=$('deckName').value.trim();if(!draft.name){msg('デッキ名を入力してください。');return}try{API.save(draft);dirty=false;render();msg('保存しました。TABULAのデッキ一覧から選べます。')}catch(e){msg('保存に失敗しました：'+e.message)}};
$('delete').onclick=()=>{if(!saved().some(d=>d.id===draft.id)||!confirm('このデッキを削除しますか？'))return;API.remove(draft.id);draft=fresh();dirty=false;render();msg('削除しました。')};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const id=new URLSearchParams(location.search).get('deck'),existing=saved().find(d=>d.id===id);if(existing)draft=copy(existing);render();msg('PLAYING CARDの54枚を編集できます。');
})();
</script></body></html>
